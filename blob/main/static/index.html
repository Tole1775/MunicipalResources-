<!DOCTYPE html>
<html lang="en">
<head>
    <!-- https://github.com/PMR-Pubclications/Municipal-Resources/blob/main/static/index.html -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Municipal Resources // Secure Data Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-6">
    <div class="max-w-4xl mx-auto space-y-8">
        
        <!-- Header -->
        <header class="border-b border-slate-800 pb-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold tracking-wider uppercase text-emerald-400">Municipal Resources</h1>
                <p class="text-xs text-slate-400">Isolated Zero-Trust Data Entry & Ledger Module</p>
            </div>
            <div class="h-3 w-3 bg-emerald-500 rounded-full animate-pulse"></div>
        </header>

        <!-- Data Entry Form -->
        <section class="bg-slate-900 border border-slate-800 rounded-lg p-6 shadow-xl">
            <h2 class="text-lg font-semibold mb-4 text-slate-200">New Ledger Entry</h2>
            <form id="entryForm" class="space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Record ID / Identifier</label>
                    <input type="text" id="recordId" required class="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-slate-100 focus:border-emerald-500 focus:outline-none" placeholder="e.g., PROP-9942-A">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Category</label>
                    <select id="recordCategory" class="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-slate-100 focus:border-emerald-500 focus:outline-none">
                        <option value="Property Tax Assessment">Property Tax Assessment</option>
                        <option value="Infrastructure Audit">Infrastructure Audit</option>
                        <option value="Municipal Payroll Index">Municipal Payroll Index</option>
                        <option value="Asset Registry">Asset Registry</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1">Data Value / Details</label>
                    <textarea id="recordValue" rows="3" required class="w-full bg-slate-950 border border-slate-800 rounded p-2.5 text-slate-100 focus:border-emerald-500 focus:outline-none" placeholder="Enter itemized details or cryptographic state payload..."></textarea>
                </div>
                <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-4 py-2 rounded transition shadow cursor-pointer">
                    Commit to Ledger
                </button>
            </form>
        </section>

        <!-- Ledger View Table -->
        <section class="bg-slate-900 border border-slate-800 rounded-lg p-6 shadow-xl">
            <h2 class="text-lg font-semibold mb-4 text-slate-200">Active Ledger Feed</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="border-b border-slate-800 text-slate-400 text-xs uppercase">
                            <th class="p-3">Timestamp (UTC)</th>
                            <th class="p-3">ID</th>
                            <th class="p-3">Category</th>
                            <th class="p-3">Value</th>
                        </tr>
                    </thead>
                    <tbody id="ledgerTableBody" class="divide-y divide-slate-800/60 font-mono text-xs">
                        <!-- Dynamically populated rows -->
                    </tbody>
                </table>
            </div>
        </section>

    </div>

    <script>
        async function fetchRecords() {
            try {
                const res = await fetch('/api/records');
                const data = await res.json();
                const tbody = document.getElementById('ledgerTableBody');
                tbody.innerHTML = '';
                if (data) {
                    data.reverse().forEach(rec => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td class="p-3 text-slate-400">${new Date(rec.timestamp).toISOString()}</td>
                            <td class="p-3 text-emerald-400 font-bold">${rec.id}</td>
                            <td class="p-3 text-slate-300">${rec.category}</td>
                            <td class="p-3 text-slate-300">${rec.data_value}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (e) {
                console.error("Failed to sync ledger feed:", e);
            }
        }

        document.getElementById('entryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                id: document.getElementById('recordId').value,
                category: document.getElementById('recordCategory').value,
                data_value: document.getElementById('recordValue').value
            };

            const res = await fetch('/api/records', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                document.getElementById('entryForm').reset();
                fetchRecords();
            }
        });

        // Initial load & poll sync
        fetchRecords();
        setInterval(fetchRecords, 5000);
    </script>
</body>
</html>
